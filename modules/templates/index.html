<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google OAuth2 Login</title>
  
</head>
<body>
  <h2>Google OAuth2 Login</h2>
  
  

  <!-- User info display area -->
  <div id="user-info" style="display: none; margin-top: 20px;">
    <h3>User Information</h3>
    <p id="user-name"></p>
    <p id="user-email"></p>
    <p id="user-id"></p>
    <img id="user-picture" alt="User Profile Picture" style="border-radius: 50%; width: 80px;">
  </div>

  
</body>
</html>
