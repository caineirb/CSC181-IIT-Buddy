{% extends "base.html" %}

{% block title %} Create Flashcard {% endblock %}

{% block name %} {{ user_name }} {% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/reviewers/flashcards/flashcards.css') }}">

<!-- For the swapping of the Cards' Orders -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>

<!-- Go Back Button -->
<button type="button" class="go-back-button" onclick="handleGoBack()">
    <i class="bi bi-arrow-left" style="margin-right: 5px;"></i> 
    <b style="font-weight: normal;">Go Back</b>
</button>

<div class="reviewer-info">
    <input type="hidden" name="save_flashcard_url" id="save_flashcard_url" value="{{ url_for('reviewers.flashcards.save_flashcard') }}">
    <input type="hidden" name="check_duplicate_url" id="check_duplicate_url" value="{{ url_for('reviewers.check_duplicate') }}">
    <input type="hidden" name="share-url" id="share-url" value="{{ url_for('reviewers_feed.take_reviewer', _external=True , id=data['id'], type=data['information'][2]) }}">
    <input type="hidden" name="_token_csrf" id="_token_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="reviewer-id" id="reviewer-id" value="{{ data['id'] }}" />
    
    <label for="reviewer-title" class="form-label">Reviewer Title</label>
    <input type="text" name="reviewer-title" id="reviewer-title" value="{{ data['information'][0] }}" placeholder="Title" maxlength="100">
    
    <!-- Dropdowns -->
    <div class="ms-5 dropdowns" style="margin-top: -50px;">
            <div class="d-flex">
                <select name="reviewer-type" id="reviewer-type" class="form-select" style="max-width: 200px; color: black;">
                    <option value="{{ data['information'][2] }}">{{ data['information'][2] }}</option>
                </select>
            </div>
            <!--here-->
            <div class="d-flex">
                <select name="reviewer-privacy" id="reviewer-privacy" class="form-select" style="max-width: 200px; color: black;" onchange="allowCopy()">
                    {% set privacy = ["Private", "Public", "Shared"] %}
                    {% for priv in privacy %}
                    <option value="{{ priv }}" {% if data['information'][3] == priv %}selected{% endif %}>{{ priv }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-flex copy-clip" title="Share Reviewer" style="position: relative;">
                <button type="button" id="share-url-button" onclick="copyURL()">
                    <i class="bi bi-copy"></i>
                </button>
                <div id="copy-alert" style="display: none; position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background-color: #d4edda; color: #155724; padding: 5px 10px; border-radius: 5px; font-size: 0.9em; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);">
                    Copied!
                </div>
            </div>            
    </div>
    
    <label for="reviewer-description" class="form-label">Reviewer Description</label>
    <textarea name="reviewer-description" id="reviewer-description" placeholder="Description" maxlength="300">{{ data['information'][1] | e }}</textarea>
</div>

<div class="action-buttons-container">
    <div>
        <button type="button" id="delete-flashcards-btn" class="delete-flashcards-btn" title="Delete Flashcard Reviewer" onclick="deleteCard()">
            <i class="bi bi-trash"></i>
        </button>
    </div>

    <div class="play-options">
        <div class="shuffle-toggle">
            <label for="shuffle-switch">Randomize Order:</label>
            <input type="checkbox" id="shuffle-switch">
        </div>
    
        <button type="button" id="save-flashcards-btn" class="save-flashcards-btn" onclick="sendFlashcardsToBackend()">
            <i class="bi bi-play-circle"></i>
        </button>
    </div>
</div>

<!-- Flashcards Container -->
<div class="flashcards-container">
    <!-- Flashcard template will be appended here -->
</div>

<div class="add-button-container">
    <button type="button" id="add-card-btn" class="add-card-btn">Add Flashcard</button>
</div>

<script type="application/json" id="data-json">
    {{ data['cards'] | tojson }}
</script>

<!-- JavaScript Files -->
<script type="text/javascript" src="{{ url_for('static', filename='javascript/reviewers/saveDetails.js') }}"></script>
<script type="text/javascript" src="{{ url_for('static', filename='javascript/reviewers/deleteReviewer.js') }}"></script>

<script type="text/javascript" src="{{ url_for('static', filename='javascript/reviewers/flashcards/saveFlashcards.js') }}"></script>
<script type="text/javascript" src="{{ url_for('static', filename='javascript/reviewers/flashcards/functionalities.js') }}"></script>
{% endblock %}
