{% extends "base.html" %}

{% block title %} Create Identifications {% endblock %}

{% block name %} {{ user_name }} {% endblock %}

{% block content %}
<style>
    {% if data['cards'] | length == 0 %}
    body{
        overflow-y: hidden;
    }
    {% endif %}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/reviewers/takes/mixed_take.css') }}">

<!-- For the swapping of the Cards' Orders -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>

<!-- Go Back Button -->
<button type="button" class="go-back-button" onclick="window.location.href = '{{ url_for('reviewers_feed.index') }}'">
    <i class="bi bi-arrow-left" style="margin-right: 5px;"></i>
    <b style="font-weight: normal;">Go Back</b>
</button>

<div class="reviewer-info">
    <input type="hidden" name="_token_csrf" id="_token_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="reviewer-id" id="reviewer-id" value="{{ data['id'] }}" />
    <input type="hidden" name="take_review_url" id="take_review_url" value="{{ url_for('reviewers.mixed.take_review', id='id_here', isRandom='random_here') }}">
    <input type="hidden" name="share-url" id="share-url" value="{{ url_for('reviewers_feed.take_reviewer', _external=True , id=data['id'], type=data['information'][2]) }}">
    <input type="hidden" name="counter-url" id="counter-url" value="{{ url_for('reviewers.takeCounter') }}">
    <label for="reviewer-title" class="form-label">Reviewer Title</label>
    <input type="text" name="reviewer-title" id="reviewer-title" value="{{ data['information'][0] }}" placeholder="Title" maxlength="100" readonly>

    <!-- Dropdowns -->
    <div class="ms-5 dropdowns" style="margin-top: -50px;">
        <div class="d-flex">
            <select name="reviewer-course" id="reviewer-course" class="form-select" style="max-width: 200px; color: black;" disabled>
                {% for course in courses %}
                <option value="{{ course[1] }}" {% if data['information'][5] == course[0] %}selected{% endif %} title="{{ course[1] }}">{{ course[0] }}</option>
                {% endfor %}
            </select>
        </div>
        <script>
            const forTitle = document.getElementById('reviewer-course').value;
            document.getElementById('reviewer-course').title = forTitle;
        </script>
        <div class="d-flex">
            <select name="reviewer-type" id="reviewer-type" class="form-select" style="max-width: 200px; color: black;" disabled>
                <option value="{{ data['information'][2] }}">{{ data['information'][2] }}</option>
            </select>
        </div>
        <div class="d-flex">
            <select name="reviewer-privacy" id="reviewer-privacy" class="form-select" style="max-width: 200px; color: black;" disabled>
                <option value="{{ data['information'][3] }}">{{ data['information'][3] }}</option>
            </select>
        </div>
        <div class="copy-clip" title="Share Reviewer" style="position: relative;">
            <button type="button" id="share-url-button" onclick="copyURL()">
                <i class="bi bi-copy"></i>
            </button>
            <div id="copy-alert" style="display: none; position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background-color: #d4edda; color: #155724; padding: 5px 10px; border-radius: 5px; font-size: 0.9em; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);">
                Copied!
            </div>
        </div>
    </div>

    <label for="reviewer-description" class="form-label">Reviewer Description</label>
    <textarea name="reviewer-description" id="reviewer-description" placeholder="Description" maxlength="300" readonly>{{ data['information'][1] | e }}</textarea>
</div>

<div class="action-buttons-container">
    <div>
        <button type="button" id="delete-mixed-btn" class="delete-mixed-btn" title="Delete Identification Reviewer" disabled>
            <i class="bi bi-trash"></i>
        </button>
    </div>
    <div class="play-options">
        <div class="shuffle-toggle">
            <label for="shuffle-switch">Randomize Order:</label>
            <input type="checkbox" id="shuffle-switch">
        </div>
        <button type="button" id="save-mixed-btn" class="save-mixed-btn" onclick="takeReview()">
            <i class="bi bi-play-circle"></i>
        </button>
    </div>
</div>

<!-- Mixed Container -->
<div class="mixed-container">
    {% if data['cards'] | length == 0 %}
    <p style="margin-top: 50px;">No Cards to Display</p>
    {% endif %}
    <!-- Mixed template will be appended here -->
</div>

<script type="application/json" id="data-json">
    {{ data['cards'] | tojson }}
</script>

<script type="text/javascript" src="{{ url_for('static', filename='javascript/reviewers/saveDetails.js') }}"></script>
<script type="text/javascript" src="{{ url_for('static', filename='javascript/reviewers/takes/mixed_take.js') }}"></script>
{% endblock %}
