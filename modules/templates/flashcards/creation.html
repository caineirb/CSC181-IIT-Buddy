<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flashcards/flashcards.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <title>Create Flashcard</title>
</head>

<body>
    <div class="reviewer-info">
        <input type="hidden" name="save_url" id="save_url" value="{{ url_for('flashcards.saveInfo') }}">
        <input type="hidden" name="_token_csrf" id="_token_csrf" value="{{ csrf_token() }}">
        <input type="hidden" name="reviewer-id" id="reviewer-id" value="{{ data['id'] }}" />
        <input type="text" name="reviewer-title" id="reviewer-title" value="{{ data['title'] }}" placeholder="Title" maxlength="100">
        
        <!-- Dropdowns -->
        <div class="dropdowns">
            <div class="dropdown">
                <select name="reviewer-type" id="reviewer-type">
                    <option value="{{ data['type'] }}">{{ data['type'] }}</option>
                </select>
            </div>
            <div class="dropdown">
                <select name="reviewer-privacy" id="reviewer-privacy">
                    {% set privacy = ["Private", "Public", "Shared"] %}
                    {% for priv in privacy %}
                    <option value="{{ priv }}" {% if data['privacy'] == priv %}selected{% endif %}>{{ priv }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <input type="text" name="reviewer-description" id="reviewer-description" value="{{ data['description'] }}" placeholder="Description" maxlength="300">
    </div>

    <button type="button" id="save-flashcards-btn" class="save-flashcards-btn" onclick="sendFlashcardsToBackend()">Save Flashcards</button>
    <input type="hidden" name="save_flashcard_url" id="save_flashcard_url" value="{{ url_for('flashcards.saveFlashcard') }}">
    <!-- Flashcards Container -->
    <div class="flashcards-container">
        <!-- Flashcard template will be appended here -->
    </div>
    <div class="add-button-container">
        <button type="button" id="add-card-btn" class="add-card-btn">Add Flashcard</button>
    </div>

    <script type="text/javascript" src="{{ url_for('static', filename='javascript/flashcards/saveDetails.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='javascript/flashcards/functionalities.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='javascript/flashcards/saveFlashcards.js') }}"></script>

</body>

</html>
