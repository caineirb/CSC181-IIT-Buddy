<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%  block title  %} {%endblock%}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/9e819ba50b.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Koulen&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
</head>
<body style="background-color: #D9D9D9;">
    <style>
        .logo-img{
            max-width: 100%;
            aspect-ratio: 1;
            object-fit: contain; 
            height: 80px; 
            width: 100px; 
            transform: translateX(20px);
            top: 80px; 
            right: 30px;
        }
    </style>
    
    <header style="height: 70px; display: flex;   width: 100%;">
        <nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary" style="width: 100%; display: flex; justify-content: space-between;">
            <div class="container-fluid">
                <button
                data-mdb-collapse-init
                class="navbar-toggler"
                type="button"
                data-mdb-target="#allofnavbar"
                aria-controls="allofnavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
                >
                <i class="fas fa-bars"></i>
                </button>
                 
                <!--logo-->
                <div class="collapse navbar-collapse" id="allofnavbar">
                    
                    <a class="navbar-logo mt-2 mt-lg-0" href="/">
                        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="logo" class="logo-img"/>
                    </a>
                </div>
                <!--Buttons and profile-->
                <div class="d-flex align-items-center gap-3">
                    <!-- Icons -->
                     <!--Faves-->
                    <a class="text-reset me-3" href="#">
                        <i class="fa-solid fa-clock fa-2xl"></i>
                    </a>
                    <!--Timer-->
                    <a class="text-reset me-3" href="{{ url_for('reviewers_feed.index') }}">
                        <i class="fa-solid fa-scroll fa-2xl"></i>
                    </a>
                    <!--FYP-->
                    <a class="text-reset me-3" href="#">
                        <i class="fa-solid fa-clipboard fa-2xl"></i>
                    </a>
                    
                    <div class="dropdown">
                        <button class="btn btn-dark dropdown-toggle d-flex align-items-center justify-content-between" type="button" id="navbarDropdownMenu" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="width: auto; height: 50px; padding: 0 10px;">
                            <div class="d-flex flex-grow-1 justify-content-center" style="margin-right: 10px;"> <!-- Center the text with Flexbox -->
                                {% block name %}{% endblock %}
                            </div>
                            <img src="{{ session['user-photo'] }}" class="rounded-circle" height="40" alt="placeholder" loading="lazy"/>
                        </button>
                    
                        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end" aria-labelledby="navbarDropdownMenu">
                            <li><a class="dropdown-item" href="/">My Profile</a></li>
                            <li><a class="dropdown-item" href="/logout">Logout</a></li>
                        </ul>
                    </div>
                    
                </div>
            </div>
        
        </nav>
    
    </header>
    {% block content %}  {% endblock %}
    <div style="background-color: #000000; width: 100%; bottom: 0; left: 0; text-align: center; position: fixed">
        <footer class="py-1">
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
</body>
</html>
