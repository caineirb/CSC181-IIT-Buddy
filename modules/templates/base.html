<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%  block title  %} {%endblock%}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/9e819ba50b.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Koulen&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
</head>
<body style="background-color: #D9D9D9;">
    
    <header style="border-bottom: 1px solid black;">
        <nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary">
            <div class="container-fluid">
                <button
                data-mdb-collapse-init
                class="navbar-toggler"
                type="button"
                data-mdb-target="#allofnavbar"
                aria-controls="allofnavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
                >
                <i class="fas fa-bars"></i>
                </button>
                 
                <!--logo-->
                <div class="collapse navbar-collapse" id="allofnavbar">
                    
                    <a class="navbar-logo mt-2 mt-lg-0" href="#">
                        <h1>IIT BUDDY</h1>
                    </a>
                </div>
                <!--Buttons and profile-->
                <div class="d-flex align-items-center gap-3">
                    <!-- Icons -->
                     <!--Faves-->
                    <a class="text-reset me-3" href="#">
                        <i class="fa-solid fa-clock fa-2xl"></i>
                    </a>
                    <!--Timer-->
                    <a class="text-reset me-3" href="#">
                        <i class="fa-solid fa-scroll fa-2xl"></i>
                    </a>
                    <!--FYP-->
                    <a class="text-reset me-3" href="#">
                        <i class="fa-solid fa-clipboard fa-2xl"></i>
                    </a>
                    
                    <div class="dropdown">
                        <button class="btn btn-dark dropdown-toggle d-flex align-items-center" type="button" id="navbarDropdownMenu" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="width: 300px; height: 50px;">
                            <div style="box-sizing: border-box; margin-left: 50px; margin-right: 40px; margin-top: 10px;">{% block name %} <p>placeholder</p> {%endblock%}</div>
                            <img src="{{ url_for('static', filename='images/LOUISE/placeholderprofile.jpg') }}" 
                                class="rounded-circle" height="40" alt="placeholder" loading="lazy"/>
                        </button>
                        
                       
                        <ul
                        class="dropdown-menu dropdown-menu-dark dropdown-menu-end"
                        aria-labelledby="navbarDropdownMenu"
                        >
                        <li>
                            <a class="dropdown-item" href="#">My Profile</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="#">Logout</a>
                        </li>
                    
                        </ul>
                    </div>
                </div>
            </div>
        
        </nav>
    
    </header>
    {% block content %}  {% endblock %}
    <div style="background-color: #000000; width: 100%; bottom: 0; left: 0; text-align: center; position: fixed">
        <footer class="py-1">
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
   
    
</body>
</html>
